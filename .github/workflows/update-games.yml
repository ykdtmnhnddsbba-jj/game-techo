name: Update games.json

on:
  schedule:
    - cron: '17 19 * * *'   # 毎日 04:17 JST
  workflow_dispatch:         # Actionsタブから手動実行も可

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PSN_STATE_KEY: ${{ secrets.PSN_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch PS5 release schedule from Famitsu
        run: node scripts/fetch-famitsu.mjs
      - name: Mark played games from PSN (optional)
        if: ${{ env.PSN_STATE_KEY != '' }}
        continue-on-error: true      # PSN側が失敗しても games.json の更新は続ける
        env:
          PSN_STATE_KEY: ${{ secrets.PSN_STATE_KEY }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: |
          npm install --no-save --no-audit --no-fund psn-api
          node scripts/fetch-psn.mjs
      - name: Commit if changed
        run: |
          for f in games.json psn-played.json psn-cache.json psn-state.enc; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update games.json"
          git push
